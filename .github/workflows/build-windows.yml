name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "DwmLutGUI/**"
      - "lutdwm/**"
      - "lutdwm.sln"

permissions:
  contents: read

jobs:
  build:
    name: Release x64
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add NuGet to PATH
        uses: NuGet/setup-nuget@v2

      - name: Restore GUI packages
        run: nuget restore DwmLutGUI/DwmLutGUI.sln -PackagesDirectory DwmLutGUI/packages

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            --x-manifest-root="$env:GITHUB_WORKSPACE/lutdwm" `
            --triplet=x64-windows-static
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" integrate install

      - name: Build native DLL
        shell: pwsh
        run: |
          msbuild lutdwm.sln /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VcpkgRoot="$env:VCPKG_INSTALLATION_ROOT/" `
            /p:OutDir="$env:GITHUB_WORKSPACE/build/native/"

      - name: Build GUI
        shell: pwsh
        run: |
          msbuild DwmLutGUI/DwmLutGUI.sln /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:OutDir="$env:GITHUB_WORKSPACE/build/package/"

      - name: Assemble test package
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE/build/package"
          $dist = "$env:GITHUB_WORKSPACE/build/dist"
          $dll = "$env:GITHUB_WORKSPACE/build/native/dwm_lut.dll"
          if (!(Test-Path "$package/DwmLutGUI.exe")) {
            throw "DwmLutGUI.exe was not produced"
          }
          if (!(Test-Path $dll)) {
            throw "dwm_lut.dll was not produced"
          }
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "$package/DwmLutGUI.exe" $dist
          Copy-Item "$package/DwmLutGUI.exe.config" $dist
          Copy-Item "$package/WindowsDisplayAPI.dll" $dist
          Copy-Item $dll $dist
          Copy-Item examples/TEST-red-blue-swap.cube $dist
          @"
          dwm_lut v4.2.2 - Windows 11 26H2 (26300) / 25H2 (26200) / 24H2 (26100)

          WHAT'S NEW IN 4.2.2
            Fixes "DWM LUT refusing to hook: required Present AOB did not match"
            on 26300.9818 / 26200.9818 (KB5127936). One tolerant signature now
            resolves exactly once on both revisions:
                26300.9711 -> RVA 0x22A230   (SDR runtime-verified)
                26300.9818 -> RVA 0x11E7F4   (SDR runtime-verified with v4.2.2)
            A uniqueness guard refuses to hook when the pattern is not unique.

          QUICK START
            1. Extract EVERYTHING into one NEW folder. Do not mix files from an
               older release - the injector copies dwm_lut.dll from the GUI's folder.
            2. Right-click DwmLutGUI.exe -> Run as administrator.
            3. Click "Load included SDR test LUT", then "Apply LUT" (both are in
               the pinned bar at the bottom). Loading alone does NOT inject.
               The screen should visibly swap red and blue.
            4. Replace the test LUT with your calibration .cube once confirmed.

          CHECK THE LOG
            dwm_lut.log is written next to DwmLutGUI.exe after Apply. Confirm:
                DWM LUT modern AOB hits: present=1 directFlip=1 overlays=1
                DWM LUT Present RVA=0x11E7F4   (9818)  or  0x22A230 (9711)
                25H2/26H2: Got texture via overlaySwapChain->vt[24]()->vt2[19]()->QI
                Matched LUT: monitor left=... top=... hdr=... lutSize=...
            If present != 1 the DLL refuses to hook on purpose. From the repo run:
                python tools/verify_dwm_signatures.py <path-to-dwmcore.dll>
                python tools/resolve_dwm_symbols.py <path-to-dwmcore.dll>

          VERIFICATION STATUS
            SDR runtime-verified on 26300.9711 (v4.2.1, 27 log-audited sessions)
            and on 26300.9818 / KB5127936 (v4.2.2, maintainer visual test).
            One package covers both; no per-build download is needed.
            HDR and multi-monitor setups remain unverified on 26H2.

          Keep all files together. Never copy dwm_lut.dll into System32.
          Disable the LUT before installing a Windows feature update.
          "@ | Set-Content "$dist/README.txt" -Encoding UTF8
          Compress-Archive -Path "$dist/*" `
            -DestinationPath "$env:GITHUB_WORKSPACE/build/dwm_lut-v4.2.2-windows-x64.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: dwm_lut-v4.2.2-windows-x64
          path: build/dwm_lut-v4.2.2-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
